name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: go test -v -race ./internal/... ./pkg/... ./tests/...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the gateway image
        run: docker build -t towline-mcp:ci .

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /towline-mcp towline-mcp:ci gateway -h 2>&1 | grep -q -- -config
