name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests from forks run here too, so the token stays read-only and
# no job uses secrets. Runners are GitHub-hosted only: never add a
# self-hosted runner to a workflow that runs on pull_request.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: go test -v -race ./internal/... ./pkg/... ./tests/...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the gateway image
        run: docker build -t towline-mcp:ci .

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /towline-mcp towline-mcp:ci gateway -h 2>&1 | grep -q -- -config
