name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Hand-written notes in docs/releases/<tag>.md replace the generated
      # changelog when present.
      - name: Choose release notes
        id: notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "args=--release-notes docs/releases/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
