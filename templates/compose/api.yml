services:
  api:
    image: "${API_IMAGE:-node:22-alpine}"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://${DB_USER:-app}:${DB_PASSWORD}@db:5432/${DB_NAME:-app}"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-app}"
      POSTGRES_USER: "${DB_USER:-app}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
