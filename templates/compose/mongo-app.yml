services:
  app:
    image: "${APP_IMAGE:-node:22-alpine}"
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: "mongodb://${MONGO_USER:-app}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-app}?authSource=admin"
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-app}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DB:-app}"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
