services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      DATABASE_URL: "postgresql://${DB_USER:-ai}:${DB_PASSWORD}@db:5432/${DB_NAME:-openwebui}"
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-openwebui}"
      POSTGRES_USER: "${DB_USER:-ai}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  ollama_data:
  webui_data:
  db_data:
